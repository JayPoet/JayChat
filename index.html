<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JayChat</title>
<meta name="description" content="A private, invite-only, end-to-end encrypted chat for friends.">
<meta name="theme-color" content="#0b0d1a" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JayChat">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
/* Apply saved theme before first paint (no flash). */
(function(){var t=localStorage.getItem('jc-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t;var m=document.getElementById('metaTheme');if(m)m.content=t==='dark'?'#0b0d1a':'#eef2ff';})();
</script>
<style>
:root{
  --bg1:#eaf0ff;--bg2:#f6edff;--ink:#12163a;--ink2:#555c85;--ink3:#8990b3;
  --glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.9);--stroke:rgba(255,255,255,.75);--line:rgba(18,22,58,.09);
  --shadow:0 12px 40px rgba(47,70,160,.16);--in:rgba(255,255,255,.82);
  --a1:#2f5bff;--a2:#8a5cff;--a3:#5ee0ff;--grad:linear-gradient(135deg,var(--a1),var(--a2));
  --danger:#e5365a;--ok:#16a34a;--r:22px;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable",system-ui,-apple-system,Roboto,sans-serif;
}
[data-theme=dark]{
  --bg1:#080a18;--bg2:#120c26;--ink:#eef1ff;--ink2:#a2a9d0;--ink3:#6f77a3;
  --glass:rgba(26,30,62,.55);--glass2:rgba(30,35,72,.92);--stroke:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);
  --shadow:0 14px 44px rgba(0,0,0,.5);--in:rgba(255,255,255,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--a1)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--a3);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--a1);left:-20vmax;top:-22vmax;opacity:.38}
.bg i:nth-child(2){background:var(--a2);right:-24vmax;top:20vh;animation-delay:-9s;opacity:.32}
.bg i:nth-child(3){background:var(--a3);left:5vmax;bottom:-34vmax;animation-delay:-16s;opacity:.22}
[data-theme=light] .bg i{opacity:.28}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.screen{position:fixed;inset:0;z-index:1;overflow:auto;padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom))}
.center{display:grid;place-items:center}
.card{width:min(100%,420px);border-radius:30px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card h1{font-size:30px;line-height:1.1;margin:6px 0 0;letter-spacing:-.02em}
.card h2{font-size:22px;margin:0;letter-spacing:-.01em}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px;color:var(--ink3)}
.logo{width:76px;height:76px;border-radius:22px;box-shadow:0 10px 30px rgba(79,91,255,.45)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:650;transition:transform .12s,filter .2s,opacity .2s;min-height:50px;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(79,91,255,.4)}
.btn.ghost{background:var(--glass);border:1px solid var(--stroke)}
.btn.danger{background:rgba(229,54,90,.14);color:var(--danger);border:1px solid rgba(229,54,90,.3)}
.btn.locked{background:transparent;border:1px dashed var(--line);color:var(--ink2);flex-direction:column;gap:0}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sm{min-height:38px;padding:8px 14px;border-radius:12px;font-size:14px}
.link{color:var(--a1);font-weight:600;padding:6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.inp{width:100%;padding:14px 15px;border-radius:14px;border:1px solid var(--line);background:var(--glass);outline:0;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--a1);box-shadow:0 0 0 4px rgba(47,91,255,.18)}
.inp.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
.hint{font-size:12.5px;min-height:16px;color:var(--ink3)}.hint.bad{color:var(--danger)}.hint.good{color:var(--ok)}
.err{color:var(--danger);font-size:13.5px;min-height:18px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;transition:background .15s}
.icon-btn:hover{background:var(--glass)}
.icon-btn svg,.ic{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:calc(var(--s)*.34);position:relative;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.4);color:#fff;background:linear-gradient(135deg,hsl(var(--h) 80% 58%),hsl(calc(var(--h) + 50) 78% 48%))}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--bg1)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--a1);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.offline{position:fixed;top:0;left:0;right:0;z-index:90;text-align:center;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:var(--danger);color:#fff;font-size:13px;font-weight:600}
/* App layout */
#app{position:fixed;inset:0;z-index:1;display:grid}
#sidebar,#main{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s}
#main{transform:translateX(100%)}
#app.in-chat #main{transform:none}
#app.in-chat #sidebar{transform:translateX(-14%);opacity:0;pointer-events:none}
.bar{display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px 10px}
.bar h1{font-size:22px;margin:0;letter-spacing:-.02em}
.search{margin:0 12px 8px;position:relative}
.search .inp{padding-left:42px;border-radius:16px}
.search .ic{position:absolute;left:13px;top:50%;margin-top:-10.5px;color:var(--ink3)}
#list{flex:1;overflow:auto;padding:4px 8px calc(16px + env(safe-area-inset-bottom))}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:20px;text-align:left;transition:background .15s}
.item:hover,.item.on{background:var(--glass)}
.item .t{display:flex;justify-content:space-between;gap:8px;font-weight:650}
.item .p{display:flex;gap:6px;color:var(--ink2);font-size:14px}
.item .p span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item time{font-size:12px;color:var(--ink3);font-weight:500;flex:none}
.badge{width:10px;height:10px;border-radius:50%;background:var(--grad);flex:none;align-self:center}
.skel{height:64px;margin:6px 4px;border-radius:20px;background:linear-gradient(90deg,var(--glass) 25%,var(--in) 50%,var(--glass) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 28px;color:var(--ink2)}
.empty .logo{width:64px;height:64px;border-radius:19px;opacity:.9}
.empty h3{margin:6px 0 0;color:var(--ink);font-size:18px}
#chatEmpty{display:none}
#chatView{display:flex;flex-direction:column;flex:1;min-height:0}
.chead{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 10px 10px;margin:0;border-radius:0 0 24px 24px}
.chead .nm{font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .st{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.day{align-self:center;margin:12px 0 6px;padding:4px 12px;border-radius:99px;font-size:12px;color:var(--ink2);background:var(--glass);border:1px solid var(--stroke)}
.msg{display:flex;max-width:100%}.msg.out{justify-content:flex-end}.msg.in{justify-content:flex-start}
.bubble{max-width:min(78%,520px);padding:8px 12px 6px;border-radius:20px;position:relative;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}}
.msg.out .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:7px;box-shadow:0 6px 18px rgba(79,91,255,.28)}
.msg.in .bubble{background:var(--in);border:1px solid var(--stroke);border-bottom-left-radius:7px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.msg.out .bubble a{color:#fff}
.bubble .who{font-size:12px;font-weight:700;color:var(--a1);margin-bottom:2px}
.bubble .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;opacity:.72;margin-top:2px;white-space:normal}
.bubble .meta .ic{width:14px;height:14px;stroke-width:2.4}
.bubble .meta .seen{color:var(--a3);opacity:1}
.msg.out .meta .seen{color:#c9f4ff}
.bubble.bad{opacity:.7;font-style:italic}
.pic-wrap{position:relative;width:min(260px,64vw);aspect-ratio:var(--ar,1.3);border-radius:14px;overflow:hidden;background:var(--in);margin:2px 0 4px;cursor:zoom-in}
.pic-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.pic-wrap.ready img{opacity:1}
.pic-wrap .spinner{position:absolute;left:50%;top:50%;margin:-13px}
.pic-wrap.ready .spinner,.pic-wrap.err .spinner{display:none}
.pic-wrap.err::after{content:"Photo unavailable";position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ink2)}
.more{align-self:center;margin:4px 0 8px}
.typing{height:22px;padding:0 20px;font-size:12.5px;color:var(--ink2)}
.composer{display:flex;align-items:flex-end;gap:8px;margin:0 10px calc(10px + env(safe-area-inset-bottom));padding:7px;border-radius:26px}
.composer textarea{flex:1;resize:none;border:0;background:transparent;outline:0;max-height:140px;padding:9px 6px;line-height:1.35}
.send{width:42px;height:42px;border-radius:15px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(79,91,255,.4);transition:transform .12s,opacity .2s}
.send:active{transform:scale(.92)}.send[disabled]{opacity:.4}
.banner{margin:0 10px calc(10px + env(safe-area-inset-bottom));padding:14px;border-radius:20px;text-align:center;color:var(--ink2);font-size:14px}
@media(min-width:880px){
  #app{grid-template-columns:380px 1fr}
  #sidebar,#main{position:relative;transform:none!important;opacity:1!important;pointer-events:auto!important}
  #sidebar{border-right:1px solid var(--line)}
  .back{display:none!important}
  #app:not(.in-chat) #chatView{display:none}
  #app:not(.in-chat) #chatEmpty{display:flex;flex:1;justify-content:center}
}
/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,7,20,.5);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(100%,520px);max-height:88dvh;border-radius:30px 30px 0 0;display:flex;flex-direction:column;background:var(--glass2);animation:up .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-wrap.out .sheet{transform:translateY(40px);opacity:0;transition:.18s}.sheet-wrap.out .scrim{opacity:0;transition:.18s}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 6px 22px}
.sheet h3{margin:0;font-size:19px}
.sheet-body{overflow:auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:30px}}
.sec{font-size:12.5px;font-weight:700;color:var(--ink3);margin:8px 0 -4px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.opt:last-child{border-bottom:0}
.opt.danger{color:var(--danger)}
.switch{position:relative;width:48px;height:28px;flex:none;border-radius:99px;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--grad)}.switch.on::after{transform:translateX(20px)}
select.inp{appearance:none;width:auto;padding:9px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);font-size:13px;display:flex;gap:6px;align-items:center}
.code{font:700 22px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;padding:16px;border-radius:18px;background:var(--in);border:1px dashed var(--a1);user-select:all;word-break:break-all}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--in)}
.seg button{flex:1;padding:8px;border-radius:11px;font-weight:600;color:var(--ink2)}.seg button.on{background:var(--glass2);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
#toasts{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;max-width:min(90vw,420px);padding:11px 16px;border-radius:16px;background:var(--glass2);border:1px solid var(--stroke);box-shadow:var(--shadow);backdrop-filter:blur(20px);font-weight:550;animation:rise .25s}
.toast.bad{background:var(--danger);color:#fff}
#lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px}
#lightbox button{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;color:#fff}
.keybox{font:700 19px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.07em;text-align:center;padding:18px 10px;border-radius:18px;background:var(--in);border:1px solid var(--a1);user-select:all}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--a1)}
.pick{display:flex;align-items:center;gap:14px}

/* ---- v2 additions ---- */
.msg .col{display:flex;flex-direction:column;max-width:min(78%,520px);min-width:0}
.msg.out .col{align-items:flex-end}.msg.in .col{align-items:flex-start}
.col .bubble{max-width:100%}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:-5px;padding:0 8px;position:relative;z-index:1}
.rchip{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--glass2);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.rchip.mine{border-color:var(--a1);background:rgba(47,91,255,.2)}
.quote{border-left:3px solid var(--a3);padding:4px 8px;margin:0 0 5px;border-radius:8px;background:rgba(0,0,0,.14);font-size:13px;cursor:pointer;white-space:normal}
.quote b{display:block;font-size:12px}.quote span{display:block;opacity:.85;max-height:2.8em;overflow:hidden}
.bubble.flash{animation:flash 1.2s}@keyframes flash{30%{box-shadow:0 0 0 4px var(--a3)}}
.replybar{display:flex;align-items:center;gap:10px;margin:0 10px 6px;padding:8px 12px;border-radius:18px;border-left:3px solid var(--a1)}
.searchbar{display:flex;align-items:center;gap:8px;margin:8px 10px 0;padding:4px 6px 4px 14px;border-radius:18px}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:8px 0}
mark{background:#ffd54a;color:#111;border-radius:4px;padding:0 2px}
.emojis{display:flex;justify-content:space-between;gap:6px}
.emojis button{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--in)}
.emojis button.mine{outline:2px solid var(--a1)}
.tree{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);margin-left:6px;color:var(--a1)}
.tag.bad{color:var(--danger)}
#lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:linear-gradient(160deg,var(--bg1),var(--bg2));padding:20px}
.lockbox{width:min(100%,340px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.dots{display:flex;gap:12px;height:18px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink2)}.dots i.f{background:var(--grad);border-color:transparent}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.pad .key{height:62px;border-radius:20px;font-size:22px;font-weight:650;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(16px);display:grid;place-items:center}
.pad .key:active{transform:scale(.94)}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div id="offline" class="offline" hidden>You're offline. Messages will send when you reconnect.</div>

<main id="splash" class="screen center"><div class="spinner"></div></main>
<main id="gate" class="screen center" hidden></main>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="bar">
      <button class="icon-btn" id="btnMe" aria-label="Settings"></button>
      <h1 class="grow">JayChat</h1>
      <button class="icon-btn" id="btnTheme" aria-label="Toggle dark mode"></button>
      <button class="icon-btn" id="btnNew" aria-label="New chat"></button>
    </div>
    <div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input class="inp" id="filter" placeholder="Search chats" autocomplete="off"></div>
    <div id="list"></div>
  </aside>
  <section id="main">
    <div id="chatEmpty" class="empty"><svg class="logo" viewBox="0 0 512 512"><use href="#logo"/></svg><h3>Pick a conversation</h3><span>Messages are end-to-end encrypted.</span></div>
    <div id="chatView" hidden>
      <header class="chead glass">
        <button class="icon-btn back" id="btnBack" aria-label="Back"></button>
        <button class="row grow" id="btnInfo" style="min-width:0;text-align:left"><span id="hAv"></span><span class="grow"><div class="nm" id="hName"></div><div class="st" id="hStatus"></div></span></button>
        <button class="icon-btn" id="btnSearch" aria-label="Search in chat"></button><button class="icon-btn" id="btnInfo2" aria-label="Chat info"></button>
      </header>
      <div id="searchBar" class="searchbar glass" hidden><input id="sq" placeholder="Search this chat" autocomplete="off" aria-label="Search this chat"><span class="tiny" id="sCount"></span><button class="btn ghost sm" id="sMore">Older</button><button class="icon-btn" id="sClose" aria-label="Close search"></button></div>
      <div id="msgs" aria-live="polite"></div>
      <div class="typing" id="typing"></div>
      <div id="replyBar" class="replybar glass" hidden></div>
      <div id="composerWrap"></div>
    </div>
  </section>
</div>

<div id="lock" hidden></div><div id="sheets"></div><div id="toasts"></div><div id="lightbox" hidden></div>
<input type="file" id="filePick" accept="image/*" hidden>

function errMsg(e) {
  const c = String(e?.code || "");
  if (c.includes("email-already-in-use")) return "That username is already taken.";
  if (/wrong-password|invalid-credential|user-not-found|invalid-email/.test(c)) return "Username or recovery key is incorrect.";
  if (c.includes("permission-denied")) return "Not allowed. If you used an invite, it may already have been used.";
  if (/network|unavailable/.test(c)) return "Network problem. Check your connection and try again.";
  if (c.includes("too-many-requests")) return "Too many attempts. Wait a bit and try again.";
  if (c.includes("operation-not-allowed")) return "Enable Email/Password sign-in in Firebase Authentication (see SETUP.md).";
  if (c.includes("requires-recent-login")) return "Please sign in again, then retry.";
  return e?.message || "Something went wrong.";
}

async function resizeImage(file, max, q, square) {
  let bmp = null;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { bmp = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); }); }
  let sw = bmp.width, sh = bmp.height, sx = 0, sy = 0;
  if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
  const sc = Math.min(1, max / Math.max(sw, sh)), w = Math.max(1, Math.round(sw * sc)), h = Math.max(1, Math.round(sh * sc));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); cx.drawImage(bmp, sx, sy, sw, sh, 0, 0, w, h);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", q));
  return { blob, w, h };
}

/* ============================ CRYPTO ============================
 * Identity: ECDH P-256 key pair per user. Private key stays on-device (IndexedDB, non-extractable)
 * and a copy wrapped with a key derived from the recovery key is stored in Firestore.
 * Private chats: AES-256-GCM key = HKDF(ECDH(me, peer)). Groups: random AES key wrapped per member.
 */
const Crypto = {
  ecdh: { name: "ECDH", namedCurve: "P-256" },
  async genIdentity() {
    const kp = await crypto.subtle.generateKey(this.ecdh, true, ["deriveBits"]);
    return { pubJwk: await crypto.subtle.exportKey("jwk", kp.publicKey), privJwk: await crypto.subtle.exportKey("jwk", kp.privateKey) };
  },
  importPriv: jwk => crypto.subtle.importKey("jwk", jwk, Crypto.ecdh, false, ["deriveBits"]),
  importPub: jwk => crypto.subtle.importKey("jwk", jwk, Crypto.ecdh, true, []),
  async shared(priv, pubStr, info) {
    const bits = await crypto.subtle.deriveBits({ name: "ECDH", public: await this.importPub(JSON.parse(pubStr)) }, priv, 256);
    const hk = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt: new Uint8Array(32), info: enc.encode(info) }, hk, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  },
  async encBytes(key, bytes, aad = "") {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: enc.encode(aad) }, key, bytes);
    return { iv: b64(iv), ct: b64(ct) };
  },
  async decBytes(key, o, aad = "") { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv), additionalData: enc.encode(aad) }, key, unb64(o.ct))); },
  encText: (key, t, aad) => Crypto.encBytes(key, enc.encode(t), aad),
  async decText(key, o, aad) { return dec.decode(await Crypto.decBytes(key, o, aad)); },
  async encBlob(key, bytes, aad) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: enc.encode(aad) }, key, bytes);
    return new Blob([iv, ct], { type: "application/octet-stream" });
  },
  async decBlob(key, buf, aad) {
    const u = new Uint8Array(buf);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12), additionalData: enc.encode(aad) }, key, u.slice(12)));
  },
  genRecoveryKey() {
    const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint8Array(25));
    return [...r].map(x => A[x % 32]).join("").match(/.{5}/g).join("-");
  },
  normKey: k => String(k || "").toUpperCase().replace(/[^A-Z2-9]/g, ""),
  async authPassword(k) { // never send the recovery key itself to Firebase Auth
    const h = await crypto.subtle.digest("SHA-256", enc.encode("jaychat-auth-v1:" + Crypto.normKey(k)));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
  },
  async wrapKey(k, salt) {
    const base = await crypto.subtle.importKey("raw", enc.encode("jaychat-wrap-v1:" + Crypto.normKey(k)), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 250000 }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  },
  async safety(a, b) {
    const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode([a, b].sort().join("|"))));
    return Array.from({ length: 6 }, (_, i) => String((h[i * 4] * 16777216 + h[i * 4 + 1] * 65536 + h[i * 4 + 2] * 256 + h[i * 4 + 3]) % 100000).padStart(5, "0")).join(" ");
  }
};
const idb = {
  _db: null,
  open() { return this._db ||= new Promise((ok, no) => { const r = indexedDB.open("jaychat", 1); r.onupgradeneeded = () => r.result.createObjectStore("keys"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  async get(k) { const d = await this.open(); return new Promise((ok, no) => { const r = d.transaction("keys").objectStore("keys").get(k); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  async set(k, v) { const d = await this.open(); return new Promise((ok, no) => { const t = d.transaction("keys", "readwrite"); t.objectStore("keys").put(v, k); t.oncomplete = ok; t.onerror = () => no(t.error); }); },
  async clear() { const d = await this.open(); return new Promise(ok => { const t = d.transaction("keys", "readwrite"); t.objectStore("keys").clear(); t.oncomplete = ok; t.onerror = ok; }); }
};

    u.oninput = () => { const ok = /^[A-Za-z0-9_.]{3,20}$/.test(u.value); h.className = "hint" + (u.value ? (ok ? " good" : " bad") : ""); h.textContent = ok ? "Looks good. Availability is checked when you create the account." : "3-20 letters, numbers, . or _ (not case sensitive)"; };

async function createAccount(username, displayName) {

let typingAt = 0;

}
function typers(c) { if (!S.prefs.typing) return []; return c.participants.filter(p => p !== S.uid && Date.now() - (c.state?.[p]?.typingAt || 0) < 6000 && !S.blocks.has(p)); }

/* ---------- messages ---------- */
function effectiveTtl(c) { return c.ttl || S.prefs.globalTtl || 0; }
function renderMessages(first, keepAnchor) {

  const prevH = el.scrollHeight, near = el.scrollHeight - el.scrollTop - el.clientHeight < 140;
  const now = Date.now();

    const ex = ms(m.expireAt); if (ex && ex < now) { if (m.sender === S.uid && !m.pending) cleanupExpired(c, m); return false; } return true;
  });

  const others = c.participants.filter(p => p !== S.uid);
  const readMax = S.prefs.receipts ? Math.max(0, ...others.map(p => ms(c.state?.[p]?.readAt))) : 0;
  let html = "", lastDay = "";
  if (S.msgs.length >= S.msgLimit) html += `<button class="btn ghost sm more" id="btnMore">Load earlier messages</button>`;
  if (S.search) { const cn = $("#sCount"); if (cn) cn.textContent = vis.length + " found"; }
  if (!vis.length && S.msgsReady && !S.uploads.length && !S.search) html += `<div class="empty">${ic("lock")}<h3>Say hi \uD83D\uDC4B</h3><span>Messages here are end-to-end encrypted. Only people in this chat can read them.</span></div>`;
  vis.forEach((m, i) => {
    const t = ms(m.createdAt) || now, dk = dayKey(t), mine = m.sender === S.uid, prev = vis[i - 1];
    if (dk !== lastDay) { html += `<div class="day">${esc(fmtDay(t))}</div>`; lastDay = dk; }
    const showName = !mine && c.type === "group" && (!prev || prev.sender !== m.sender || dayKey(ms(prev.createdAt)) !== dk);

      const w = Math.min(4000, Math.max(1, +m.img.w | 0)), h = Math.min(4000, Math.max(1, +m.img.h | 0)), cached = S.imgCache.get(m.img.path);

  });

  el.innerHTML = html;

}
async function cleanupExpired(c, m) {

  deleteDoc(doc(db, "chats", c.id, "messages", m.id)).catch(() => { });
  if (m.img?.path) deleteObject(sref(storage, m.img.path)).catch(() => { });
}
setInterval(() => { if (S.active && S.msgs.some(m => ms(m.expireAt))) renderMessages(); }, 30000);

function imageUrl(c, path) {
  if (S.imgCache.has(path)) return Promise.resolve(S.imgCache.get(path));
  if (S.imgInflight.has(path)) return S.imgInflight.get(path);
  const p = (async () => {
    const buf = await getBytes(sref(storage, path)); const raw = await Crypto.decBlob(await chatKey(c), buf, c.id);
    const url = URL.createObjectURL(new Blob([raw], { type: "image/jpeg" })); S.imgCache.set(path, url); return url;
  })().finally(() => S.imgInflight.delete(path));
  S.imgInflight.set(path, p); return p;
}
function hydrateImages(c) {
  $$("#msgs .pic-wrap").forEach(async w => {
    const img = $("img", w); if (img.getAttribute("src")) { w.classList.add("ready"); return; }
    const path = img.dataset.path; if (!path.startsWith(`chats/${c.id}/`)) { w.classList.add("err"); return; }
    try { const url = await imageUrl(c, path); if (img.isConnected) { img.src = url; w.classList.add("ready"); } } catch (e) { console.warn("img", e); w.classList.add("err"); }
  });
}
function onMsgClick(e) {

  if (e.target.closest("a")) return;
  const rc = e.target.closest(".rchip"); if (rc) { const rm = S.msgs.find(x => x.id === rc.dataset.mid); if (rm) react(rm, rc.dataset.react); return; }
  const qt = e.target.closest(".quote"); if (qt) { const tg = $(`.bubble[data-id="${CSS.escape(qt.dataset.goto)}"]`); if (tg) { tg.scrollIntoView({ block: "center", behavior: "smooth" }); tg.classList.add("flash"); setTimeout(() => tg.classList.remove("flash"), 1300); } else toast("That message isn't loaded. Tap Load earlier messages."); return; }
  const w = e.target.closest(".pic-wrap.ready");
  const b = e.target.closest(".bubble"); if (!b) return;
  const m = S.msgs.find(x => x.id === b.dataset.id); if (!m) return;
  if (w) { const lb = $("#lightbox"); lb.innerHTML = `<img src="${$("img", w).src}" alt="Photo"><button aria-label="Close">${ic("x")}</button>`; lb.hidden = false; lb.onclick = () => lb.hidden = true; return; }

}
async function deleteMessage(m) {
  const c = S.chats.get(S.active); if (!c) return;
  try {
    await deleteDoc(doc(db, "chats", c.id, "messages", m.id));
    if (m.img?.path) deleteObject(sref(storage, m.img.path)).catch(() => { });
    const rest = S.msgs.filter(x => x.id !== m.id), last = rest[rest.length - 1];
    if (c.lastMessage && ms(c.lastMessage.at) <= (ms(m.createdAt) || 0) + 1) {
      await updateDoc(chatRef(c.id), { lastMessage: last ? { from: last.sender, type: last.type, enc: last.enc, at: last.createdAt } : null });
    }
    toast("Message deleted");
  } catch (e) { toast(errMsg(e), true); }
}

async function doSend() {
  const inp = $("#input"), text = inp?.value.trim(); if (!text) return;
  const c = S.chats.get(S.active); if (!c) return; inp.value = ""; inp.style.height = "auto"; $("#btnSend").disabled = true;
  try {
    const key = await chatKey(c), body = await Crypto.encText(key, text, c.id), ttl = effectiveTtl(c);
    const reply = S.replyTo ? { id: S.replyTo.id, sender: S.replyTo.sender, enc: await Crypto.encText(key, S.replyTo.text, c.id) } : null;
    const mref = doc(collection(db, "chats", c.id, "messages")), b = writeBatch(db);
    b.set(mref, { sender: S.uid, chatId: c.id, type: "text", enc: body, createdAt: serverTimestamp(), expireAt: ttl ? Timestamp.fromMillis(Date.now() + ttl * 1000) : null, ...(reply ? { reply } : {}) });
    b.update(chatRef(c.id), { lastMessage: { from: S.uid, type: "text", enc: body, at: serverTimestamp() }, updatedAt: serverTimestamp(), [`state.${S.uid}.typingAt`]: 0, [`state.${S.uid}.lastOpened`]: serverTimestamp() });
    b.commit().catch(e => { toast("Message couldn't be sent. " + errMsg(e), true); });
    typingAt = 0; setReply(null);
  } catch (e) { toast(errMsg(e), true); inp.value = text; }
}
async function sendImage(file) {
  const c = S.chats.get(S.active); if (!c) return;
  if (!file.type.startsWith("image/") || file.size > 25 * 1024 * 1024) { toast("Choose an image under 25 MB.", true); return; }
  if (!navigator.onLine) { toast("You're offline. Photos need a connection.", true); return; }
  let up = null;
  try {
    let r = await resizeImage(file, 1280, .78); if (r.blob.size > 2.4e6) r = await resizeImage(file, 960, .6);
    if (r.blob.size > 2.4e6) throw new Error("That photo is too large even after compression.");
    up = { url: URL.createObjectURL(r.blob), w: r.w, h: r.h }; S.uploads.push(up); renderMessages(false);
    $("#msgs").scrollTop = $("#msgs").scrollHeight;
    const key = await chatKey(c), mref = doc(collection(db, "chats", c.id, "messages")), path = `chats/${c.id}/${mref.id}`;
    const blob = await Crypto.encBlob(key, new Uint8Array(await r.blob.arrayBuffer()), c.id);
    await uploadBytes(sref(storage, path), blob, { contentType: "application/octet-stream", customMetadata: { uid: S.uid } });
    S.imgCache.set(path, up.url);
    const cap = $("#input")?.value.trim() || ""; if (cap) { $("#input").value = ""; }
    const capEnc = await Crypto.encText(key, cap, c.id), ttl = effectiveTtl(c), b = writeBatch(db);
    b.set(mref, { sender: S.uid, chatId: c.id, type: "image", enc: capEnc, img: { path, w: r.w, h: r.h }, createdAt: serverTimestamp(), expireAt: ttl ? Timestamp.fromMillis(Date.now() + ttl * 1000) : null });
    b.update(chatRef(c.id), { lastMessage: { from: S.uid, type: "image", enc: capEnc, at: serverTimestamp() }, updatedAt: serverTimestamp(), [`state.${S.uid}.lastOpened`]: serverTimestamp() });
    await b.commit();
  } catch (e) { console.error(e); toast(e.code?.includes("unauthorized") ? "Photo upload isn't allowed. Check the Storage rules." : errMsg(e), true); }
  finally { if (up) { S.uploads = S.uploads.filter(x => x !== up); renderMessages(false); } }
}

/* ---------- notifications ---------- */
async function notifyIncoming(c) {
  if (chatMuted(c.id) || !S.prefs.notify) return; const from = c.lastMessage.from; if (S.blocks.has(from)) return;
  if (S.active === c.id && document.visibilityState === "visible") return;
  const body = (c.type === "group" ? U(from).displayName.split(" ")[0] + ": " : "") + (S.previews.get(c.id)?.text || "New message");
  if (document.visibilityState === "visible") { const t = toast(`${chatTitle(c)}: ${body}`); t.style.cursor = "pointer"; t.onclick = () => { location.hash = "#/chat/" + c.id; t.remove(); }; return; }
  if ("Notification" in window && Notification.permission === "granted") {
    try { const reg = await navigator.serviceWorker.ready; reg.showNotification(chatTitle(c), { body, tag: c.id, icon: "icons/icon-192.png", badge: "icons/icon-192.png", data: { chat: c.id } }); } catch { }
  }
}
async function enablePush(silent) {
  if (!("Notification" in window)) { if (!silent) toast("Notifications aren't supported here.", true); return false; }
  const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
  if (perm !== "granted") { if (!silent) toast("Notifications are blocked in your browser settings.", true); return false; }
  if (VAPID_KEY) {
    try {
      const { getMessaging, getToken } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js");
      const token = await getToken(getMessaging(fbApp), { vapidKey: VAPID_KEY, serviceWorkerRegistration: await navigator.serviceWorker.ready });
      if (token && !(S.prefs.fcmTokens || []).includes(token)) await setDoc(prefsRef(), { fcmTokens: arrayUnion(token) }, { merge: true });
    } catch (e) { console.warn("FCM", e); }
  }
  return true;
}
async function setPref(patch) { Object.assign(S.prefs, patch); try { await setDoc(prefsRef(), patch, { merge: true }); } catch (e) { toast(errMsg(e), true); } }

/* ---------- new chat / group ---------- */
async function searchUsers(q) {
  q = q.trim().toLowerCase(); const col = collection(db, "users");
  const qq = q ? query(col, where("usernameLower", ">=", q), where("usernameLower", "<=", q + "\uf8ff"), limit(15)) : query(col, orderBy("usernameLower"), limit(20));
  return (await getDocs(qq)).docs.map(d => ({ uid: d.id, ...d.data() })).filter(u => u.uid !== S.uid && !S.bans.has(u.uid));
}
function openNewChat() {
  let mode = "direct", picked = new Map(), results = [], timer;
  sheet("New chat", `<div class="seg"><button data-m="direct" class="on">Direct</button><button data-m="group">Group</button></div><div id="gName" hidden><input class="inp" id="gname" maxlength="60" placeholder="Group name"><div class="chips" id="chips" style="margin-top:8px"></div></div><input class="inp" id="q" autocomplete="off" autocapitalize="none" placeholder="Search by username"><div id="res"></div><button class="btn primary" id="mk" hidden>Create group</button>`, (b, close) => {
    const res = $("#res", b), q = $("#q", b);
    const draw = () => {
      res.innerHTML = results.length ? results.map(u => `<button class="opt" data-u="${esc(u.uid)}">${avatar(u, 40)}<span class="grow"><b>${esc(u.displayName)}</b><div class="muted small">@${esc(u.username)}</div></span>${picked.has(u.uid) ? ic("check") : ""}</button>`).join("") : '<p class="muted small">No one found. Usernames are matched by prefix.</p>';
      $("#chips", b).innerHTML = [...picked.values()].map(u => `<span class="chip">${esc(u.displayName)}<button data-r="${esc(u.uid)}" aria-label="Remove">${ic("x")}</button></span>`).join("");
      $("#mk", b).hidden = mode !== "group"; $("#mk", b).disabled = picked.size < 1;
    };
    const run = async () => { try { results = await searchUsers(q.value); } catch (e) { results = []; toast(errMsg(e), true); } draw(); };
    q.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 250); };
    $$(".seg button", b).forEach(x => x.onclick = () => { mode = x.dataset.m; $$(".seg button", b).forEach(y => y.classList.toggle("on", y === x)); $("#gName", b).hidden = mode !== "group"; picked.clear(); draw(); });
    b.onclick = async e => {
      const r = e.target.closest("[data-r]"); if (r) { picked.delete(r.dataset.r); draw(); return; }
      const o = e.target.closest("[data-u]"); if (!o) return; const u = results.find(x => x.uid === o.dataset.u);
      if (mode === "direct") { close(); startDirect(u); } else { picked.has(u.uid) ? picked.delete(u.uid) : picked.size < 11 ? picked.set(u.uid, u) : toast("Groups are limited to 12 people.", true); draw(); }
    };
    $("#mk", b).onclick = async () => { const name = $("#gname", b).value.trim(); if (!name) { toast("Give the group a name.", true); return; } $("#mk", b).disabled = true; await createGroup(name, [...picked.values()]); close(); };
    run();
  });
}
async function startDirect(u) {
  const id = chatKeyId(S.uid, u.uid); if (S.chats.has(id)) { location.hash = "#/chat/" + id; return; }
  try {
    const parts = [S.uid, u.uid].sort();
    await setDoc(chatRef(id), { type: "private", participants: parts, pubs: { [S.uid]: S.profile.pub, [u.uid]: u.pub }, state: {}, ttl: 0, lastMessage: null, createdBy: S.uid, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    location.hash = "#/chat/" + id;
  } catch (e) { toast(errMsg(e), true); }
}
async function createGroup(name, members) {
  try {
    const ref = doc(collection(db, "chats")), all = [S.profile, ...members], parts = all.map(u => u.uid || S.uid), pubs = {}, keys = {};
    all.forEach(u => pubs[u.uid || S.uid] = u.pub);
    const raw = crypto.getRandomValues(new Uint8Array(32));
    for (const u of all) { const id = u.uid || S.uid; const kek = await Crypto.shared(S.priv, u.pub, "group:" + ref.id); keys[id] = { by: S.uid, ...(await Crypto.encBytes(kek, raw, ref.id)) }; }
    await setDoc(ref, { type: "group", name, participants: parts, pubs, keys, state: {}, ttl: 0, lastMessage: null, createdBy: S.uid, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    location.hash = "#/chat/" + ref.id;
  } catch (e) { toast(errMsg(e), true); }
}

const genCode = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint8Array(16)); return [...r].map(x => A[x % 32]).join("").match(/.{4}/g).join("-"); };

    else { await setDoc(doc(db, "blocks", id), { blocker: S.uid, blocked: uid, createdAt: serverTimestamp() }); toast("Blocked. They can no longer message you."); }
  } catch (e) { toast(errMsg(e), true); }
}

async function deleteAccount(recoveryKey) {

function subscribeReactions() {

    const c = S.chats.get(id); if (!c || S.active !== id) return;
    let key = null; try { key = await chatKey(c); } catch { }
    const map = new Map();
    for (const d of snap.docs) {
      const r = d.data(); if (!r.enc || !key) continue;
      const ck = "r" + d.id + r.enc.iv; let e = S.decCache.get(ck);
      if (e === undefined) { try { e = await Crypto.decText(key, r.enc, id); } catch { e = null; } if (e !== null) S.decCache.set(ck, e); }
      if (!e || e.length > 8) continue;
      if (!map.has(r.mid)) map.set(r.mid, new Map()); map.get(r.mid).set(r.uid, e);
    }
    if (S.active !== id) return; S.reacts = map; renderMessages();
  }, () => { });
}

async function addToGroup(c, users) {
  const e = c.keys?.[S.uid]; if (!e) throw new Error("You don't have this group's key.");
  const raw = await Crypto.decBytes(await Crypto.shared(S.priv, c.pubs[e.by], "group:" + c.id), e, c.id);
  const patch = { participants: [...c.participants, ...users.map(u => u.uid)] };
  for (const u of users) {
    const kek = await Crypto.shared(S.priv, u.pub, "group:" + c.id);
    patch[`keys.${u.uid}`] = { by: S.uid, ...(await Crypto.encBytes(kek, raw, c.id)) }; patch[`pubs.${u.uid}`] = u.pub;
  }
  await updateDoc(chatRef(c.id), patch);
}

  try {
    const snap = await getDocs(collection(db, "users")), users = new Map(snap.docs.map(d => [d.id, { uid: d.id, ...d.data() }]));
    const kids = new Map(); users.forEach(u => { const p = users.has(u.invitedBy) ? u.invitedBy : "root"; if (!kids.has(p)) kids.set(p, []); kids.get(p).push(u.uid); });
    const byTime = (x, y) => ms(users.get(x).createdAt) - ms(users.get(y).createdAt);
    const rows = [], seen = new Set();
    const walk = (uid, d) => { if (seen.has(uid)) return; seen.add(uid); rows.push({ u: users.get(uid), d }); (kids.get(uid) || []).sort(byTime).forEach(k => walk(k, d + 1)); };
    (kids.get("root") || []).sort(byTime).forEach(k => walk(k, 0));
    const desc = uid => { const out = []; const go = x => (kids.get(x) || []).forEach(k => { out.push(k); go(k); }); go(uid); return out; };
    b.innerHTML = `<p class="muted small">${users.size} members. An indented row was invited by the person above it.</p>` + rows.map(({ u, d }) => {
      const tags = (u.invitedBy === "admin" ? '<span class="tag">Founder</span>' : "") + (S.admins.has(u.uid) ? '<span class="tag">Admin</span>' : "") + (S.bans.has(u.uid) ? '<span class="tag bad">Removed</span>' : "") + (u.uid === S.uid ? '<span class="tag">You</span>' : "");
      return `<div class="tree" style="margin-left:${Math.min(d, 6) * 14}px">${avatar(u, 34)}<span class="grow"><b>${esc(u.displayName)}</b> <span class="muted small">@${esc(u.username)}</span>${tags}</span>${u.uid === S.uid ? "" : `<button class="btn ghost sm" data-m="${esc(u.uid)}">Manage</button>`}</div>`;
    }).join("");
    b.onclick = e => { const m = e.target.closest("[data-m]"); if (m) manageUser(users.get(m.dataset.m), desc(m.dataset.m), b); };
  } catch (e) { b.textContent = errMsg(e); }
}
async function banMany(ids) {
  for (let i = 0; i < ids.length; i += 400) { const bt = writeBatch(db); ids.slice(i, i + 400).forEach(id => bt.set(doc(db, "bans", id), { by: S.uid, createdAt: serverTimestamp() })); await bt.commit(); }
}
function manageUser(u, descIds, listEl) {
  const isAdm = S.admins.has(u.uid), founder = u.invitedBy === "admin", gone = S.bans.has(u.uid);
  const chain = descIds.filter(x => !S.admins.has(x) && !S.bans.has(x));
  sheet(u.displayName, `<p class="muted small">@${esc(u.username)}</p>
    ${isAdm ? (founder ? '<p class="muted small">Founder admin. This can\'t be changed.</p>' : `<button class="opt" id="aDem">Remove admin rights</button>`) : (gone ? "" : `<button class="opt" id="aPro">${ic("shield")} Make admin</button>`)}
    ${gone ? `<button class="opt" id="aRes">Restore access</button>` : (isAdm ? '<p class="muted small">Remove their admin rights first if you want to remove them from JayChat.</p>' : `<button class="opt danger" id="aBan">${ic("ban")} Remove from JayChat</button>`)}
    ${!gone && !isAdm && chain.length ? `<button class="opt danger" id="aChain">${ic("ban")} Remove them and everyone they invited (${chain.length + 1})</button>` : ""}
    ${!gone && !isAdm && descIds.length > chain.length ? '<p class="muted small">Admins and people already removed in their invite chain are skipped.</p>' : ""}`, (b, close) => {
    const run = async (fn, msg) => { close(); try { await fn(); toast(msg); } catch (e) { toast(errMsg(e), true); } setTimeout(() => loadAdmin(listEl), 600); };
    $("#aPro", b)?.addEventListener("click", () => run(() => setDoc(doc(db, "admins", u.uid), { promotedBy: S.uid, createdAt: serverTimestamp() }), `${u.displayName} is now an admin`));
    $("#aDem", b)?.addEventListener("click", () => run(() => deleteDoc(doc(db, "admins", u.uid)), "Admin rights removed"));
    $("#aRes", b)?.addEventListener("click", () => run(() => deleteDoc(doc(db, "bans", u.uid)), "Access restored"));
    $("#aBan", b)?.addEventListener("click", async () => { close(); if (await confirmSheet(`Remove ${u.displayName}?`, "They will no longer be able to read or send messages, and their messages disappear for everyone. You can restore them later.", "Remove")) run(() => banMany([u.uid]), "Removed"); });
    $("#aChain", b)?.addEventListener("click", async () => { close(); if (await confirmSheet("Remove the whole chain?", `This removes ${u.displayName} and ${chain.length} ${chain.length === 1 ? "person" : "people"} they invited (directly or indirectly). You can restore people one by one later.`, "Remove them all")) run(() => banMany([u.uid, ...chain]), "Removed"); });
  });
}

/* ============================ APP LOCK ============================ */
const LOCK_KEY = "jc-lock";
const lockCfg = () => { try { return JSON.parse(localStorage.getItem(LOCK_KEY)); } catch { return null; } };
const saveLock = c => localStorage.setItem(LOCK_KEY, JSON.stringify(c));
async function pinHash(pin, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode("jaychat-pin:" + pin), "PBKDF2", false, ["deriveBits"]);
  return b64(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 150000 }, base, 256));
}
async function verifyPin(pin) { const c = lockCfg(); return !!c && (await pinHash(pin, unb64(c.salt))) === c.hash; }
async function bioRegister() {
  const cred = await navigator.credentials.create({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: "JayChat" }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: S.profile?.username || "user", displayName: S.profile?.displayName || "User" }, pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }], authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "discouraged" }, timeout: 60000 } });
  return b64(cred.rawId);
}
async function bioCheck(rawId) {
  await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: "public-key", id: unb64(rawId) }], userVerification: "required", timeout: 60000 } });
}
function pinSheet(title, again) {
  return new Promise(res => {
    let done = false;
    const s = sheet(title, `<input class="inp mono" id="p1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="4 to 6 digits">${again ? '<input class="inp mono" id="p2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="Repeat PIN">' : ""}<div class="err" id="pe"></div><button class="btn primary" id="pg">Continue</button>`, (b, close) => {
      $("#pg", b).onclick = () => {
        const a = $("#p1", b).value; if (!/^\d{4,6}$/.test(a)) { $("#pe", b).textContent = "Use 4 to 6 digits."; return; }
        if (again && a !== $("#p2", b).value) { $("#pe", b).textContent = "The two PINs don't match."; return; }
        done = true; close(); res(a);
      };
    });
    new MutationObserver((_, o) => { if (!document.body.contains(s.el)) { o.disconnect(); if (!done) res(null); } }).observe($("#sheets"), { childList: true });
  });
}
async function setPin() {
  const pin = await pinSheet("Choose a PIN", true); if (!pin) return false;
  const salt = crypto.getRandomValues(new Uint8Array(16)), old = lockCfg();
  saveLock({ salt: b64(salt), hash: await pinHash(pin, salt), len: pin.length, delay: old?.delay ?? 60, bio: old?.bio || null }); return true;
}
let lockPromise = null, lockFails = 0, lockUntil = 0;
const requireUnlock = () => lockCfg() ? showLock() : Promise.resolve();
function showLock() {
  if (lockPromise) return lockPromise;
  const cfg = lockCfg(); if (!cfg) return Promise.resolve();
  $("#sheets").innerHTML = ""; $("#lightbox").hidden = true;
  const el = $("#lock"); el.hidden = false; let pin = "", busy = false;
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, "bio", 0, "del"];
  el.innerHTML = `<div class="lockbox">${logo(64)}<h2 style="margin:0">JayChat is locked</h2><div class="dots" id="ldots"></div><div class="err" id="lerr"></div><div class="pad">${keys.map(k => `<button class="key" data-k="${k}" ${k === "bio" && !cfg.bio ? 'disabled style="visibility:hidden"' : ""} aria-label="${k === "del" ? "Delete" : k === "bio" ? "Use biometrics" : k}">${k === "del" ? "\u232B" : k === "bio" ? ic("shield") : k}</button>`).join("")}</div><button class="link" id="lforgot">Forgot PIN?</button></div>`;
  const dots = () => { $("#ldots").innerHTML = Array.from({ length: cfg.len }, (_, i) => `<i class="${i < pin.length ? "f" : ""}"></i>`).join(""); }; dots();
  lockPromise = new Promise(resolve => {
    const done = () => { el.hidden = true; el.innerHTML = ""; lockPromise = null; lockFails = 0; resolve(); };
    const tryBio = async () => { if (!cfg.bio) return; try { await bioCheck(cfg.bio); done(); } catch { } };
    el.onclick = async e => {
      if (e.target.closest("#lforgot")) { if (confirm("Forgot your PIN?\n\nThe only way in is to sign out of this device (this erases its local data) and sign back in with your recovery key. Sign out now?")) doSignOut(); return; }
      const k = e.target.closest("[data-k]")?.dataset.k; if (k === undefined || busy) return;
      if (k === "bio") return tryBio();
      if (k === "del") { pin = pin.slice(0, -1); dots(); return; }
      if (Date.now() < lockUntil) { $("#lerr").textContent = `Too many tries. Wait ${Math.ceil((lockUntil - Date.now()) / 1000)}s.`; return; }
      $("#lerr").textContent = ""; if (pin.length >= cfg.len) return; pin += k; dots();
      if (pin.length === cfg.len) {
        busy = true; const ok = await verifyPin(pin); busy = false;
        if (ok) return done();
        lockFails++; pin = ""; dots(); $("#lerr").textContent = "Wrong PIN.";
        $(".lockbox")?.animate([{ transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "none" }], { duration: 220 });
        if (lockFails >= 5) lockUntil = Date.now() + 30000 * (lockFails - 4);
      }
    };
    tryBio();
  });
  return lockPromise;
}
document.addEventListener("visibilitychange", () => {
  const cfg = lockCfg(); if (!cfg || !S.uid) return;
  if (document.visibilityState === "hidden") { S.hiddenAt = Date.now(); if (cfg.delay === 0) showLock(); }
  else if (S.hiddenAt && Date.now() - S.hiddenAt >= cfg.delay * 1000) showLock();
});
function lockRows() {
  const cfg = lockCfg();
  if (!cfg) return `<button class="opt" id="lkOn">${ic("lock")} Turn on app lock</button>`;
  return `<div class="opt"><span class="grow">Auto-lock</span><select class="inp" id="lkDelay">${[[0, "Immediately"], [60, "After 1 minute"], [300, "After 5 minutes"]].map(([v, l]) => `<option value="${v}" ${v === cfg.delay ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    ${window.PublicKeyCredential ? `<div class="opt"><span class="grow">Use fingerprint / face<div class="muted small">Your PIN always stays as a backup</div></span><button class="switch ${cfg.bio ? "on" : ""}" id="lkBio" role="switch" aria-checked="${!!cfg.bio}" aria-label="Biometric unlock"></button></div>` : ""}
    <button class="opt" id="lkChg">${ic("lock")} Change PIN</button><button class="opt danger" id="lkOff">${ic("x")} Turn off app lock</button>`;
}
function bindLock(b, close) {
  const reopen = () => setTimeout(openSettings, 250);
  $("#lkOn", b)?.addEventListener("click", async () => { close(); if (await setPin()) toast("App lock is on"); reopen(); });
  $("#lkChg", b)?.addEventListener("click", async () => { close(); const cur = await pinSheet("Enter your current PIN"); if (cur === null) return; if (!(await verifyPin(cur))) { toast("Wrong PIN", true); return; } if (await setPin()) toast("PIN changed"); reopen(); });
  $("#lkOff", b)?.addEventListener("click", async () => { close(); const cur = await pinSheet("Enter your PIN to turn off"); if (cur === null) return; if (!(await verifyPin(cur))) { toast("Wrong PIN", true); return; } localStorage.removeItem(LOCK_KEY); toast("App lock is off"); reopen(); });
  $("#lkDelay", b)?.addEventListener("change", e => { const c = lockCfg(); c.delay = +e.target.value; saveLock(c); });
  $("#lkBio", b)?.addEventListener("click", async e => {
    const c = lockCfg(), el = e.currentTarget;
    if (c.bio) { c.bio = null; el.classList.remove("on"); }
    else { try { c.bio = await bioRegister(); el.classList.add("on"); } catch { toast("This device couldn't set up fingerprint/face unlock.", true); return; } }
    saveLock(c);
  });
}
